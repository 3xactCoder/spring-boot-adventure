databaseChangeLog:
  - changeSet:
      id: update-admin-password
      author: vova
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password
                  # BCrypt hash для пароля: admin1234
                  value: '$2a$10$w8g/C0H2n4E5c0AflkQGne7q9M3N8P5E6o8u1r7G5.h6k7m8n9q2.'
            where: "email = 'admin@example.com'"